<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Lost in the Matrix</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .error-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            filter: drop-shadow(var(--glow));
        }

        .error-message {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 15px;
        }

        .error-desc {
            color: var(--text-gray);
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 40px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>
    <!-- Noise Overlay -->
    <div class="noise-overlay"></div>
    <div class="grid-overlay"></div>

    <nav>
        <div class="logo">TANVIR<span>.DEV</span></div>
        <div class="nav-items">
            <a href="index.html">RETURN HOME</a>
        </div>
    </nav>

    <section class="error-section">
        <div class="error-code">404</div>
        <h1 class="error-message">SYSTEM OFFLINE</h1>
        <p class="error-desc">The data packet you are looking for has been lost in the digital void. Return to the main
            network.</p>
        <a href="index.html" class="btn home-btn"><i class="fas fa-home"></i> BACK TO BASE</a>
    </section>

    <!-- Essential Scripts -->
    <script src="script.js"></script>
</body>

</html>
