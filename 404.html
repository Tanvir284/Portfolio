<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Lost in the Matrix</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#050505">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=41">

    <style>
        .error-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            filter: drop-shadow(var(--glow));
        }

        .error-message {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 15px;
        }

        .error-desc {
            color: var(--text-gray);
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 40px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        /* The shared stylesheet hides the native cursor for the custom one,
           which this page does not run -- restore a real pointer. */
        body,
        a,
        button {
            cursor: auto;
        }

        a,
        button {
            cursor: pointer;
        }
    </style>
    <script>
        /* Applied before first paint: run after the page has rendered, the
           theme swap sticks on any element with `transition: all`, and the
           page visibly flashes dark before turning light. */
        (function () {
            try {
                if (localStorage.getItem('theme') === 'light') {
                    document.documentElement.classList.add('light-mode');
                }
                var accent = localStorage.getItem('accent');
                var themes = {
                    cyan: ['#00f3ff', '#b000ff', 'rgba(0, 243, 255, 0.4)'],
                    emerald: ['#00ff9d', '#00b8ff', 'rgba(0, 255, 157, 0.4)'],
                    crimson: ['#ff0055', '#ff9d00', 'rgba(255, 0, 85, 0.4)']
                };
                if (accent && themes[accent]) {
                    var t = themes[accent], root = document.documentElement.style;
                    root.setProperty('--primary', t[0]);
                    root.setProperty('--secondary', t[1]);
                    root.setProperty('--glow', '0 0 20px ' + t[2]);
                }
            } catch (e) { /* private mode */ }
        })();
    </script>
</head>

<body>
    <!-- Noise Overlay -->
    <div class="noise-overlay"></div>
    <div class="grid-overlay"></div>

    <nav>
        <div class="logo">TANVIR<span>.DEV</span></div>
        <div class="nav-items">
            <a href="index.html">RETURN HOME</a>
        </div>
    </nav>

    <section class="error-section">
        <div class="error-code">404</div>
        <h1 class="error-message">SYSTEM OFFLINE</h1>
        <p class="error-desc">The data packet you are looking for has been lost in the digital void. Return to the main
            network.</p>
        <a href="index.html" class="btn home-btn"><i class="fas fa-home"></i> BACK TO BASE</a>
    </section>

</body>

</html>
